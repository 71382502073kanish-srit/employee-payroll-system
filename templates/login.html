<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | PayrollPro</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login"><div class="login-card"><div class="login-logo">◈ PayrollPro</div><p class="muted">Employee Payroll & Naming Convention System</p><h2>Welcome back</h2><p class="muted">Sign in with your assigned account.</p>{% with ms=get_flashed_messages() %}{% for m in ms %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button class="primary full">Sign In →</button></form><div class="demo">Accounts are created by an Administrator.</div></div></body></html>
